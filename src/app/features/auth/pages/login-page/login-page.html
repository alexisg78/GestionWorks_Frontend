<div class="w-full">
  <!-- Header -->
  <div class="mb-8 text-center">
    <h1 class="text-4xl font-bold">Iniciar Sesión</h1>

    <p class="text-base-content/70 mt-3">
      Accede a tu cuenta para gestionar tickets e incidencias.
    </p>
  </div>

  <!-- Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <fieldset class="fieldset bg-base-100 border-base-300 rounded-box border p-6 shadow-md">
      <legend class="fieldset-legend text-primary text-lg font-medium">Acceso</legend>

      <!-- Email -->
      <div>
        <label class="label">
          <span class="label-text">Correo electrónico</span>
        </label>

        <input
          type="email"
          placeholder="ejemplo@correo.com"
          class="input focus:border-primary w-full focus:outline-none"
          formControlName="email"
        />
      </div>

      <!-- Password -->
      <div class="mt-4">
        <label class="label">
          <span class="label-text">Contraseña</span>
        </label>

        <input
          type="password"
          placeholder="••••••••"
          class="input focus:border-primary w-full focus:outline-none"
          formControlName="password"
        />
      </div>

      <!-- Remember -->
      <div class="mt-4 flex items-center justify-between">
        <label class="label cursor-pointer gap-2">
          <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
          <span class="label-text">Recordarme</span>
        </label>

        <a href="#" class="link link-hover text-primary text-sm"> ¿Olvidaste tu contraseña? </a>
      </div>

      <!-- Actions -->
      <div class="mt-6">
        <button type="submit" class="btn btn-primary w-full">Ingresar</button>
      </div>
    </fieldset>
  </form>

  <!-- Footer -->
  <div class="mt-6 text-center">
    <p class="text-base-content/70 text-sm">
      ¿No tienes una cuenta?

      <a [routerLink]="['/auth/register']" class="text-primary hover:underline"> Registrarse </a>
    </p>
  </div>
</div>
