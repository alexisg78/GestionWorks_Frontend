<div class="w-full">
  <!-- Header -->
  <div class="mb-5 text-center">
    <h1 class="text-4xl font-bold">Crear Cuenta</h1>

    <p class="text-base-content/70 mt-3">Registra una nueva cuenta para acceder al sistema.</p>
  </div>

  <!-- Form -->
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <fieldset class="fieldset bg-base-100 border-base-300 rounded-box border p-6 shadow-md">
      <legend class="fieldset-legend text-primary text-lg font-medium">Registro</legend>

      <!-- Nombre -->
      <div>
        <label class="label">
          <span class="label-text">Nombre Completo</span>
        </label>

        <input
          type="text"
          placeholder="Ej: Alexis Gonzalez"
          class="input focus:border-primary w-full focus:outline-none"
          formControlName="fullName"
        />
      </div>

      <!-- Email -->
      <div class="mt-4">
        <label class="label">
          <span class="label-text">Correo Electrónico</span>
        </label>

        <input
          type="email"
          placeholder="ejemplo@correo.com"
          class="input focus:border-primary w-full focus:outline-none"
          formControlName="email"
        />
      </div>

      <!-- Password -->
      <div class="mt-4">
        <label class="label">
          <span class="label-text">Contraseña</span>
        </label>

        <input
          type="password"
          placeholder="••••••••"
          class="input focus:border-primary w-full focus:outline-none"
          formControlName="password"
        />
      </div>

      <!-- Rol -->
      <div class="mt-4">
        <label class="label">
          <span class="label-text">Rol</span>
        </label>

        <select class="select focus:border-primary w-full focus:outline-none">
          <option selected>Usuario</option>
          <option disabled>Admin</option>
          <option disabled>Técnico</option>
        </select>

        <div class="label">
          <span class="label-text-alt text-base-content/60">
            Si no seleccionas un rol, se asignará el rol por defecto.
          </span>
        </div>
      </div>

      <!-- Actions -->
      <div class="mt-6">
        <button type="submit" class="btn btn-primary w-full">Crear Cuenta</button>
      </div>
    </fieldset>
  </form>

  <!-- Footer -->
  <div class="mt-6 text-center">
    <p class="text-base-content/70 text-sm">
      ¿Ya tienes una cuenta?

      <a [routerLink]="['/auth/login']" class="text-primary hover:underline"> Iniciar Sesión </a>
    </p>
  </div>
</div>

@if (hasError()) {
  <div role="alert" class="alert alert-error fixed right-5 bottom-5 w-52">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 shrink-0 stroke-current"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <span>Por favor, revise la información ingresada!</span>
  </div>
}
