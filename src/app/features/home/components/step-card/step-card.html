<div class="card bg-base-100 card-lg h-full shadow-sm">
  <div class="card-body">
    <div class="flex items-center gap-4">
      <div
        class="bg-primary text-primary-content flex size-10 shrink-0 items-center justify-center rounded-full font-bold"
      >
        {{ step() }}
      </div>

      <h3 class="card-title">
        {{ title() }}
      </h3>
    </div>

    <p class="text-base-content/70 mt-2">
      {{ description() }}
    </p>
  </div>
</div>
