<div class="bg-base-100 border-base-300 rounded-box mb-6 border p-4 shadow-md">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
    <input
      type="text"
      placeholder="Buscar ticket..."
      class="input w-full focus:outline-none"
      (input)="searchChange.emit(txtSearch.value)"
      #txtSearch
    />

    <select
      class="select w-full focus:outline-none"
      (change)="onStatusChange(statusSelect.value)"
      #statusSelect
    >
      <option value="">Todos los estados</option>
      @for (status of statuses; track status) {
        <option [value]="status">
          {{ statusLabels[status] }}
        </option>
      }
    </select>

    <select
      class="select w-full focus:outline-none"
      (change)="onPriorityChange(prioritySelect.value)"
      #prioritySelect
    >
      <option value="">Todas las prioridades</option>
      @for (priority of priorities; track priority) {
        <option [value]="priority">
          {{ priorityLabels[priority] }}
        </option>
      }
    </select>
  </div>
</div>
